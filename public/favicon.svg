<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F54" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />

  <!-- PET Monogram Emblem Centered -->
  <g transform="translate(18, 54) scale(0.47)">
    <!-- Letter P -->
    <g>
      <!-- Vertical Stem -->
      <rect x="0" y="5" width="28" height="150" fill="#FFFFFF" />
      <!-- Curved Loop -->
      <path d="M 28 5 L 85 5 C 125 5 145 32 145 68 C 145 104 125 128 85 128 L 28 128 Z" fill="#FFFFFF" />
      <!-- Cutout -->
      <path d="M 28 32 L 72 32 C 96 32 112 45 112 68 C 112 90 96 102 72 102 L 28 102 Z" fill="#0A1128" />

      <!-- 3D Isometric Precast Concrete Box -->
      <g transform="translate(42, 36) scale(1.15)">
        <!-- Top Face -->
        <polygon points="26,4 48,16 26,28 4,16" fill="#93C5FD" stroke="#0A1128" stroke-width="1.5" stroke-linejoin="round" />
        <polygon points="26,10 40,17.5 26,25 12,17.5" fill="#FFFFFF" />

        <!-- Right Face -->
        <polygon points="26,28 48,16 48,50 26,62" fill="#0066FF" stroke="#0A1128" stroke-width="1.5" stroke-linejoin="round" />

        <!-- Left Face -->
        <polygon points="4,16 26,28 26,62 4,50" fill="#3B82F6" stroke="#0A1128" stroke-width="1.5" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Letter E (3 Horizontal Bars) -->
    <g transform="translate(156, 12)">
      <rect x="0" y="0" width="138" height="30" rx="3" fill="#0066FF" />
      <rect x="0" y="56" width="138" height="30" rx="3" fill="#0066FF" />
      <rect x="0" y="112" width="138" height="30" rx="3" fill="#0066FF" />
    </g>

    <!-- Letter T -->
    <g transform="translate(315, 12)">
      <!-- Top Bar -->
      <rect x="0" y="0" width="144" height="30" rx="3" fill="#FFFFFF" />
      <!-- Vertical Stem -->
      <rect x="52" y="30" width="40" height="112" rx="3" fill="#FFFFFF" />
    </g>
  </g>
</svg>
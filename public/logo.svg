<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 220" width="100%" height="100%">
  <defs>
    <style>
      .pet-text-title {
        font-family: 'Montserrat', 'Inter', 'Arial Black', sans-serif;
        font-weight: 900;
        fill: #003B95;
        letter-spacing: 0.14em;
      }
      .pet-sub-text {
        font-family: 'Montserrat', 'Inter', 'Arial Black', sans-serif;
        font-weight: 800;
        fill: #003B95;
        letter-spacing: 0.35em;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- PET Monogram -->
  <g transform="translate(10, 20)">
    <!-- Letter P -->
    <g>
      <!-- Vertical Stem -->
      <rect x="0" y="5" width="28" height="150" fill="#003B95" />
      <!-- Curved Loop -->
      <path d="M 28 5 L 85 5 C 125 5 145 32 145 68 C 145 104 125 128 85 128 L 28 128 Z" fill="#003B95" />
      <!-- Cutout -->
      <path d="M 28 32 L 72 32 C 96 32 112 45 112 68 C 112 90 96 102 72 102 L 28 102 Z" fill="#FFFFFF" />

      <!-- 3D Isometric Precast Concrete Box -->
      <g transform="translate(42, 36) scale(1.15)">
        <!-- Top Face (Ice / Sky Blue) -->
        <polygon points="26,4 48,16 26,28 4,16" fill="#93C5FD" stroke="#003B95" stroke-width="1.2" stroke-linejoin="round" />
        <polygon points="26,10 40,17.5 26,25 12,17.5" fill="#FFFFFF" />

        <!-- Right Face (Accent Blue) -->
        <polygon points="26,28 48,16 48,50 26,62" fill="#0066FF" stroke="#003B95" stroke-width="1.2" stroke-linejoin="round" />

        <!-- Left Face (Deep Navy Blue) -->
        <polygon points="4,16 26,28 26,62 4,50" fill="#003B95" stroke="#003B95" stroke-width="1.2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Letter E (3 Horizontal Bars) -->
    <g transform="translate(156, 12)">
      <rect x="0" y="0" width="138" height="30" fill="#0066FF" />
      <rect x="0" y="56" width="138" height="30" fill="#0066FF" />
      <rect x="0" y="112" width="138" height="30" fill="#0066FF" />
    </g>

    <!-- Letter T -->
    <g transform="translate(315, 12)">
      <!-- Top Bar -->
      <rect x="0" y="0" width="144" height="30" fill="#003B95" />
      <!-- Vertical Stem -->
      <rect x="52" y="30" width="40" height="112" fill="#003B95" />
    </g>
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="486" y1="26" x2="486" y2="182" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Right Typography Section -->
  <!-- Line 1: PRECAST + TM badge -->
  <g transform="translate(506, 60)">
    <text x="0" y="0" class="pet-text-title" font-size="34">PRECAST</text>
    <!-- TM Badge -->
    <rect x="236" y="-27" width="26" height="23" rx="3" fill="#0066FF" />
    <text x="249" y="-12" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" text-anchor="middle">TM</text>
  </g>

  <!-- Line 2: ENGINEERING + & badge -->
  <g transform="translate(506, 108)">
    <text x="0" y="0" class="pet-text-title" font-size="34">ENGINEERING</text>
    <!-- & Badge -->
    <rect x="368" y="-27" width="28" height="23" rx="4" fill="#0066FF" />
    <text x="382" y="-11" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="900" font-size="14" text-anchor="middle">&amp;</text>
  </g>

  <!-- Line 3: TECHNOLOGIES -->
  <g transform="translate(506, 155)">
    <text x="0" y="0" class="pet-text-title" font-size="34">TECHNOLOGIES</text>
  </g>

  <!-- Tagline: FUTURISTIC PRECASTING.... -->
  <g transform="translate(508, 178)">
    <text x="0" y="0" class="pet-sub-text">FUTURISTIC PRECASTING....</text>
  </g>
</svg>

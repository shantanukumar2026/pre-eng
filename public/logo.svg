<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" fill="none">
  <!-- Styles for crisp typography -->
  <style>
    .brand-p-text {
      font-family: 'Inter', 'Montserrat', -apple-system, sans-serif;
      font-weight: 900;
      fill: #003B95;
    }
  </style>

  <!-- Big 'P' Mark -->
  <g transform="translate(10, 10)">
    <!-- Vertical left stem of P -->
    <rect x="20" y="10" width="80" height="150" fill="#003B95" />
    
    <!-- Curved right loop of P -->
    <path d="M 100 10 L 160 10 C 215 10 235 45 235 85 C 235 125 215 160 160 160 L 100 160 Z" fill="#003B95" />
    
    <!-- Inner cutout of P -->
    <path d="M 100 45 L 140 45 C 165 45 180 60 180 85 C 180 110 165 125 140 125 L 100 125 Z" fill="#ffffff" />
    
    <!-- 3D Isometric Precast Concrete Block -->
    <g transform="translate(94, 38)">
      <!-- Top Face (Ice / Sky Blue) -->
      <polygon points="40,6 74,23 40,40 6,23" fill="#A5C2F6" stroke="#ffffff" stroke-width="2" />
      <polygon points="40,14 62,25 40,36 18,25" fill="#ffffff" />
      
      <!-- Right Side Face (Periwinkle Accent Blue) -->
      <polygon points="40,40 74,23 74,72 40,89" fill="#5484E8" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Left Side Face (Deep Navy Blue) -->
      <polygon points="6,23 40,40 40,89 6,72" fill="#003B95" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Small Nested Box Highlight -->
      <g transform="translate(14, 42)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#5484E8" stroke="#ffffff" stroke-width="1" />
        <polygon points="0,6 12,12 12,24 0,18" fill="#003B95" stroke="#ffffff" stroke-width="1" />
        <polygon points="12,12 24,6 24,18 12,24" fill="#002766" stroke="#ffffff" stroke-width="1" />
      </g>
    </g>
  </g>

  <!-- Typography: PRECAST -->
  <text x="270" y="142" font-size="118" class="brand-p-text" letter-spacing="-0.02em">PRECAST</text>

  <!-- Typography: ENGINEERING -->
  <text x="30" y="245" font-size="82" class="brand-p-text" letter-spacing="0.04em">ENGINEERING</text>
</svg>
